# Refresh managed Spec Kit project files and open a PR when updates are available.
# See https://github.github.com/spec-kit/upgrade.html
#
# Callers should provide schedule/dispatch wrappers and grant:
#   permissions: contents: write, pull-requests: write
name: Upgrade Spec Kit

on:
  workflow_call:
    inputs:
      specify_version:
        description: "Spec Kit release tag (e.g. v1.0.5). Leave empty for latest stable."
        required: false
        default: ""
        type: string
      script:
        description: "Script type passed to specify integration upgrade --script"
        required: false
        default: "sh"
        type: string
      pr_branch:
        description: "Branch name for the upgrade pull request"
        required: false
        default: "automation/speckit-upgrade"
        type: string
      commit_message:
        description: "Commit message for the upgrade PR"
        required: false
        default: "chore: upgrade Spec Kit project files"
        type: string
      add_paths:
        description: "Newline-separated paths to include in the upgrade PR"
        required: false
        default: |
          .specify/
          .agents/skills/
        type: string
      pr_title_prefix:
        description: "PR title prefix; project version is appended"
        required: false
        default: "chore: upgrade Spec Kit to"
        type: string
    outputs:
      before_version:
        description: "Project version from .specify/integration.json before upgrade"
        value: ${{ jobs.upgrade.outputs.before_version }}
      after_version:
        description: "Project version from .specify/integration.json after upgrade"
        value: ${{ jobs.upgrade.outputs.after_version }}
      speckit_tag:
        description: "Resolved Spec Kit CLI release tag"
        value: ${{ jobs.upgrade.outputs.speckit_tag }}

concurrency:
  group: speckit-upgrade
  cancel-in-progress: false

jobs:
  upgrade:
    name: Upgrade Spec Kit project files
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      before_version: ${{ steps.before.outputs.version }}
      after_version: ${{ steps.after.outputs.version }}
      speckit_tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@c7f87aa956e4c323abf06d5dec078e358f6b4d04 # v6.0.0

      - name: Resolve Spec Kit release tag
        id: version
        env:
          INPUT_VERSION: ${{ inputs.specify_version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          if [ -n "$INPUT_VERSION" ]; then
            tag="$INPUT_VERSION"
          else
            tag="$(curl -sSf \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/github/spec-kit/releases/latest" \
              | jq -r '.tag_name // empty')"
          fi

          if [ -z "$tag" ]; then
            echo "Unable to resolve a Spec Kit release tag." >&2
            exit 1
          fi

          if [[ "$tag" != v* ]]; then
            tag="v${tag}"
          fi

          # Reject values that are not release-tag shaped (blocks shell metacharacters).
          if [[ ! "$tag" =~ ^v[0-9A-Za-z._-]+$ ]]; then
            echo "Invalid Spec Kit release tag: ${tag}" >&2
            exit 1
          fi

          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

      - name: Install specify-cli
        env:
          SPECKIT_TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          uv tool install specify-cli --force \
            --from "git+https://github.com/github/spec-kit.git@${SPECKIT_TAG}"

      - name: Capture current project version
        id: before
        run: |
          set -euo pipefail
          version="$(jq -r '.version // "unknown"' .specify/integration.json)"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Upgrade installed integrations
        env:
          SCRIPT: ${{ inputs.script }}
        run: |
          set -euo pipefail

          while IFS= read -r key; do
            echo "Upgrading integration: ${key}"
            specify integration upgrade "${key}" --force --script "${SCRIPT}"
          done < <(jq -r '.installed_integrations[]' .specify/integration.json)

      - name: Update installed extensions
        run: specify extension update

      - name: Capture upgraded project version
        id: after
        run: |
          set -euo pipefail
          version="$(jq -r '.version // "unknown"' .specify/integration.json)"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Summarize upgrade result
        id: summary
        env:
          SPECKIT_TAG: ${{ steps.version.outputs.tag }}
          BEFORE_VERSION: ${{ steps.before.outputs.version }}
          AFTER_VERSION: ${{ steps.after.outputs.version }}
          ADD_PATHS: ${{ inputs.add_paths }}
        run: |
          set -euo pipefail
          integrations="$(jq -r '.installed_integrations | join(", ")' .specify/integration.json)"

          {
            echo "### Spec Kit upgrade"
            echo "- CLI release: \`${SPECKIT_TAG}\`"
            echo "- Project version: \`${BEFORE_VERSION}\` → \`${AFTER_VERSION}\`"
            echo "- Integrations: ${integrations}"
          } >> "$GITHUB_STEP_SUMMARY"

          {
            echo "Automated Spec Kit project-file upgrade."
            echo
            echo "- CLI release: \`${SPECKIT_TAG}\`"
            echo "- Project version: \`${BEFORE_VERSION}\` → \`${AFTER_VERSION}\`"
            echo "- Integrations upgraded: ${integrations}"
            echo "- Extensions refreshed via \`specify extension update\`"
            echo
            echo "Managed paths included in this PR (from \`add_paths\`):"
            while IFS= read -r path; do
              [ -z "$path" ] && continue
              echo "- \`${path}\`"
            done <<< "$ADD_PATHS"
            echo
            echo "Paths updated on the runner but not listed above (for example gitignored"
            echo "\`.claude/\` or \`.cursor/skills/\`) are not committed. After merging, run"
            echo "\`specify integration upgrade <key>\` locally if you rely on those integrations."
            echo
            echo "Review the diff for any managed files that may have overwritten local customizations."
          } > /tmp/speckit-upgrade-pr-body.md

      - name: Create pull request
        uses: peter-evans/create-pull-request@271a8d0340265f705b14b6d32b9829c1cb33d45e # v7.0.8
        with:
          commit-message: ${{ inputs.commit_message }}
          title: ${{ inputs.pr_title_prefix }} ${{ steps.after.outputs.version }}
          body-path: /tmp/speckit-upgrade-pr-body.md
          branch: ${{ inputs.pr_branch }}
          delete-branch: true
          add-paths: ${{ inputs.add_paths }}
